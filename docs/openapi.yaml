openapi: 3.1.0
info:
  title: MidoriVPN Core and Control API
  version: 2.0.0
  summary: Executable HTTP contract for the MidoriVPN 2.0 Core service.
  description: |
    Contract for the Core node plane, OAuth exchange, user Control API,
    administration API, PKI resources, tunnel upgrade, and Control WebSocket.
    Some operations are enabled only in the principal deployment profile or
    when their transport/PKI capability is configured.
  license:
    name: GNU Affero General Public License v3.0
    identifier: AGPL-3.0-or-later
servers:
  - url: /
    description: Same-origin API behind the deployment TLS reverse proxy.
security:
  - BearerAuth: []
tags:
  - {name: Health, description: 'Public liveness and readiness signals plus authenticated dependency health.'}
  - {name: Infrastructure, description: 'Operational infrastructure observations exposed to authorized administrators.'}
  - {name: Node plane, description: 'Signed Core-node enrollment, desired state, peer lifecycle, and statistics.'}
  - {name: OAuth, description: 'Public OIDC discovery and browser or native-client token lifecycle operations.'}
  - {name: PKI, description: 'Client-certificate enrollment, revocation, and public CA or CRL resources.'}
  - {name: Profile, description: 'Authenticated user identity, quota, dashboard, and audit information.'}
  - {name: Credentials, description: 'Short-lived scoped credentials for proxy and tunnel transports.'}
  - {name: Servers, description: 'Available VPN servers and their observed reachability.'}
  - {name: Connections, description: 'Persistent devices, active connections, session history, and tunnel upgrades.'}
  - {name: Mesh, description: 'User mesh membership, node activation, invitations, and exit-node selection.'}
  - {name: Administration, description: 'Privileged user, server, node, cluster, peer, mesh, and audit operations.'}
  - {name: Realtime, description: 'WebSocket upgrades for live Control statistics and WSS tunnel traffic.'}

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      security: []
      responses:
        '200': {$ref: '#/components/responses/HealthOK'}
  /livez:
    get:
      operationId: getLiveness
      tags: [Health]
      security: []
      responses:
        '200': {$ref: '#/components/responses/LivenessOK'}
  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      security: []
      responses:
        '200': {$ref: '#/components/responses/ReadinessOK'}
        '503': {$ref: '#/components/responses/ReadinessDegraded'}
  /.well-known/midorivpn/edge-health:
    get:
      operationId: probeEdgeHealth
      tags: [Health]
      security: []
      description: Minimal public client reachability probe. It returns no node, user, capacity, or version data.
      responses:
        '204': {$ref: '#/components/responses/EdgeHealth'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    head:
      operationId: probeEdgeHealthHeaders
      tags: [Health]
      security: []
      description: Header-only form of the minimal public client reachability probe.
      responses:
        '204': {$ref: '#/components/responses/EdgeHealth'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/tunnel/ws:
    get:
      operationId: openTunnelWebSocket
      tags: [Connections, Realtime]
      security: [{TunnelBearer: []}]
      x-midorivpn-availability: WSSTunnelEnabled
      description: WebSocket upgrade carrying tunnel datagrams with a short-lived scoped credential.
      responses:
        '101': {description: WebSocket protocol switch.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/node/enroll:
    post:
      operationId: enrollCoreNode
      tags: [Node plane]
      security:
        - EnrollmentBearer: []
          NodeID: []
          NodeTimestamp: []
          NodeNonce: []
          NodeSignature: []
      requestBody: {$ref: '#/components/requestBodies/NodeEnrollment'}
      responses:
        '201': {$ref: '#/components/responses/NodeEnrollment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/node/heartbeat:
    post:
      operationId: reportCoreNodeHeartbeat
      tags: [Node plane]
      security:
        - NodeID: []
          NodeTimestamp: []
          NodeNonce: []
          NodeSignature: []
      requestBody: {$ref: '#/components/requestBodies/NodeHeartbeat'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/node/desired-state:
    get:
      operationId: getCoreNodeDesiredState
      tags: [Node plane]
      security:
        - NodeID: []
          NodeTimestamp: []
          NodeNonce: []
          NodeSignature: []
      responses:
        '200': {$ref: '#/components/responses/SignedDesiredState'}
        '204': {description: No desired revision has been issued for this node.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/peers:
    parameters: []
    get:
      operationId: listNodePeers
      tags: [Node plane]
      security: &nodeSignatureSecurity
        - NodeID: []
          NodeTimestamp: []
          NodeNonce: []
          NodeSignature: []
      responses:
        '200': {$ref: '#/components/responses/NodePeerList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      operationId: addNodePeer
      tags: [Node plane]
      security: *nodeSignatureSecurity
      requestBody: {$ref: '#/components/requestBodies/AddPeer'}
      responses:
        '200': {$ref: '#/components/responses/NodePeerProvision'}
        '201': {$ref: '#/components/responses/NodePeerProvision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/peers/{pubkey}:
    parameters:
      - {$ref: '#/components/parameters/PublicKey'}
    put:
      operationId: updateNodePeer
      tags: [Node plane]
      security: *nodeSignatureSecurity
      requestBody: {$ref: '#/components/requestBodies/UpdatePeer'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: removeNodePeer
      tags: [Node plane]
      security: *nodeSignatureSecurity
      parameters:
        - {$ref: '#/components/parameters/ExpectedOperationID'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/peers/{pubkey}/stats:
    parameters:
      - {$ref: '#/components/parameters/PublicKey'}
    get:
      operationId: getNodePeerStats
      tags: [Node plane]
      security: *nodeSignatureSecurity
      responses:
        '200': {$ref: '#/components/responses/NodePeer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/stats:
    get:
      operationId: getNodeStats
      tags: [Node plane]
      security: *nodeSignatureSecurity
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}

  /extension/callback:
    get:
      operationId: completeExtensionOAuth
      tags: [OAuth]
      security: []
      x-midorivpn-config-key: EXTENSION_CALLBACK_PATH
      x-midorivpn-availability: principal profile with DB and JWKS
      parameters:
        - {name: code, in: query, required: false, schema: {type: string}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: error, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Human-readable completion page that attempts to close itself.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {text/html: {schema: {type: string}}}
  /api/v1/auth/config:
    get:
      operationId: getOIDCConfiguration
      tags: [OAuth]
      security: []
      x-midorivpn-availability: principal profile with DB and JWKS
      responses:
        '200':
          description: Public OIDC client discovery.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OIDCConfigurationEnvelope'}
  /api/v1/auth/callback:
    post:
      operationId: exchangeAuthorizationCode
      tags: [OAuth]
      security: []
      x-midorivpn-availability: principal profile with DB and JWKS
      requestBody: {$ref: '#/components/requestBodies/OAuthCallback'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/auth/refresh:
    post:
      operationId: refreshOIDCTokens
      tags: [OAuth]
      security: []
      x-midorivpn-availability: principal profile with DB and JWKS
      requestBody: {$ref: '#/components/requestBodies/OAuthRefresh'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        default: {$ref: '#/components/responses/InternalError'}
  /api/v1/auth/logout:
    post:
      operationId: logoutOIDCSession
      tags: [OAuth]
      security: []
      x-midorivpn-availability: principal profile with DB and JWKS
      requestBody: {$ref: '#/components/requestBodies/OAuthLogout'}
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /pki/client-ca.pem:
    get:
      operationId: getClientCertificateAuthority
      tags: [PKI]
      security: []
      x-midorivpn-availability: configured client PKI
      responses:
        '200':
          description: Public client CA certificate.
          content: {application/x-pem-file: {schema: {type: string}}}
  /pki/client.crl:
    get:
      operationId: getClientCertificateRevocationList
      tags: [PKI]
      security: []
      x-midorivpn-availability: configured client PKI
      responses:
        '200':
          description: Signed DER certificate revocation list.
          content:
            application/pkix-crl:
              schema: {type: string, contentEncoding: base64}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/control/me:
    get:
      operationId: getCurrentUser
      tags: [Profile]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/control/quota:
    get:
      operationId: getCurrentUserQuota
      tags: [Profile]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/control/dashboard/summary:
    get:
      operationId: getCurrentUserDashboardSummary
      tags: [Profile]
      description: Returns device counts, quota, aggregate traffic, and recent sessions without deriving devices from peer history. Infrastructure is present only for administrators.
      responses:
        '200': {$ref: '#/components/responses/DashboardSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/proxy-credentials:
    post:
      operationId: createProxyCredential
      tags: [Credentials]
      requestBody: {$ref: '#/components/requestBodies/ProxyCredential'}
      responses:
        '200': {$ref: '#/components/responses/ProxyCredential'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/control/tunnel-credentials:
    post:
      operationId: createTunnelCredential
      tags: [Credentials]
      requestBody: {$ref: '#/components/requestBodies/TunnelCredential'}
      responses:
        '200': {$ref: '#/components/responses/TunnelCredential'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /api/v1/control/servers:
    get:
      operationId: listAvailableServers
      tags: [Servers]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/servers/candidates:
    get:
      operationId: listServerCandidates
      tags: [Servers]
      description: Returns only capacity-eligible modeled placements with a current centrally certified transport.
      parameters:
        - name: protocol
          in: query
          required: true
          schema: {type: string, enum: [wireguard, wss, masque, openvpn, ikev2, proxy]}
      responses:
        '200': {$ref: '#/components/responses/ServerCandidateList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/certificates:
    get:
      operationId: listDeviceCertificates
      tags: [PKI]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: enrollDeviceCertificate
      tags: [PKI]
      requestBody: {$ref: '#/components/requestBodies/CertificateEnrollment'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/control/certificates/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    delete:
      operationId: revokeDeviceCertificate
      tags: [PKI]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/control/devices:
    get:
      operationId: listCurrentUserDevices
      tags: [Connections]
      responses:
        '200': {$ref: '#/components/responses/DeviceList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/devices/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    patch:
      operationId: updateCurrentUserDevice
      tags: [Connections]
      requestBody: {$ref: '#/components/requestBodies/DeviceUpdate'}
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      operationId: revokeCurrentUserDevice
      tags: [Connections]
      responses:
        '200': {$ref: '#/components/responses/Device'}
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/devices/{id}/sessions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/PageSize'}
      - {name: status, in: query, schema: {type: string, enum: [all, active, inactive], default: all}}
      - {name: sort, in: query, schema: {type: string, enum: [created_at, last_handshake, traffic], default: created_at}}
      - {$ref: '#/components/parameters/Order'}
    get:
      operationId: listCurrentUserDeviceSessions
      tags: [Connections]
      responses:
        '200': {$ref: '#/components/responses/DeviceSessionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/control/connections:
    get:
      operationId: listCurrentUserConnections
      tags: [Connections]
      description: Returns active sessions only; historical sessions are paginated under their device.
      responses:
        '200': {$ref: '#/components/responses/ConnectionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createConnection
      tags: [Connections]
      requestBody: {$ref: '#/components/requestBodies/Connection'}
      responses:
        '200': {$ref: '#/components/responses/ConnectionConfiguration'}
        '201': {$ref: '#/components/responses/ConnectionConfiguration'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '502': {$ref: '#/components/responses/BadGateway'}
  /api/v1/control/connections/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    delete:
      operationId: disconnectConnection
      tags: [Connections]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '202': {$ref: '#/components/responses/Accepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/connections/{id}/config:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: exportWireGuardConfiguration
      tags: [Connections]
      responses:
        '200':
          description: WireGuard configuration text.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {text/plain: {schema: {type: string}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/control/connections/{id}/qr:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: exportWireGuardQRCode
      tags: [Connections]
      responses:
        '200':
          description: PNG QR code for the WireGuard configuration.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content: {image/png: {schema: {type: string, contentEncoding: base64}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/audit-logs:
    get:
      operationId: listCurrentUserAuditLogs
      tags: [Profile]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}

  /api/v1/control/mesh:
    get:
      operationId: listCurrentUserMeshes
      tags: [Mesh]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createMesh
      tags: [Mesh]
      requestBody: {$ref: '#/components/requestBodies/MeshCreate'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/v1/control/mesh/join:
    post:
      operationId: joinMesh
      tags: [Mesh]
      requestBody: {$ref: '#/components/requestBodies/MeshJoin'}
      responses:
        '201': {$ref: '#/components/responses/Created'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '410': {$ref: '#/components/responses/Gone'}
  /api/v1/control/mesh/auto:
    post:
      operationId: enableAutomaticMesh
      tags: [Mesh]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '201': {$ref: '#/components/responses/Created'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: deleteAutomaticMesh
      tags: [Mesh]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/control/mesh/node:
    get:
      operationId: getMeshNodeStatus
      tags: [Mesh]
      responses:
        '200': {$ref: '#/components/responses/OK'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: activateMeshNode
      tags: [Mesh]
      responses:
