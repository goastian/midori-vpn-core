      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/DeviceSessionPage'}
    DurableOperationStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [disconnect_pending, ban_cleanup_pending, device_cleanup_pending]
        operation_id:
          type: string
          format: uuid
          description: Present when the pending transition is backed by a durable peer operation.
    DurableOperationStatusEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/DurableOperationStatus'}
    ConnectionSummary:
      type: object
      description: A persisted connection summary. It never includes a preshared key.
      required: [id, user_id, server_id, public_key, assigned_ip, is_active, device_name]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        user_email: {type: string, format: email}
        server_id: {type: string, format: uuid}
        public_key: {type: string}
        assigned_ip: {type: string}
        is_active: {type: boolean}
        device_name: {type: string}
        device_id: {type: string, format: uuid}
        last_handshake: {type: string, format: date-time}
        bytes_sent: {type: integer, format: int64}
        bytes_received: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
      additionalProperties: false
    ConnectionConfiguration:
      type: object
      description: Sensitive WireGuard material returned only while creating or recovering the authorized connection.
      required: [peer_id, device_id, peer_ip, server_public_key, server_endpoint, dns, allowed_ips]
      properties:
        peer_id: {type: string, format: uuid}
        device_id: {type: string, format: uuid}
        peer_ip: {type: string}
        server_public_key: {type: string}
        server_endpoint: {type: string}
        preshared_key:
          type: string
          x-midorivpn-sensitive: true
          description: Returned only in this authorized configuration response and never in connection listings.
        pq_kem_ciphertext:
          type: string
          x-midorivpn-sensitive: true
        dns: {type: string}
        allowed_ips: {type: string}
      additionalProperties: false
    ConnectionListEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {type: array, items: {$ref: '#/components/schemas/ConnectionSummary'}}
      additionalProperties: false
    DashboardTraffic:
      type: object
      additionalProperties: false
      required: [bytes_sent, bytes_received]
      properties:
        bytes_sent: {type: integer, format: int64, minimum: 0}
        bytes_received: {type: integer, format: int64, minimum: 0}
    DashboardRecentSession:
      type: object
      additionalProperties: false
      required: [id, device_id, device_name, server_id, server_name, protocol, assigned_ip, is_active, bytes_sent, bytes_received, last_handshake, created_at]
      properties:
        id: {type: string, format: uuid}
        device_id: {type: [string, 'null'], format: uuid}
        device_name: {type: string, minLength: 1, maxLength: 64}
        server_id: {type: string, format: uuid}
        server_name: {type: string, minLength: 1}
        protocol: {type: string, enum: [wireguard, openvpn, ikev2, wss, masque, proxy]}
        assigned_ip: {type: string, minLength: 1}
        is_active: {type: boolean}
        bytes_sent: {type: integer, format: int64, minimum: 0}
        bytes_received: {type: integer, format: int64, minimum: 0}
        last_handshake: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    DashboardInfrastructure:
      type: object
      additionalProperties: false
      required: [total_users, total_servers, active_servers, total_peers, active_peers, total_bytes_sent, total_bytes_received]
      properties:
        total_users: {type: integer, minimum: 0}
        total_servers: {type: integer, minimum: 0}
        active_servers: {type: integer, minimum: 0}
        total_peers: {type: integer, minimum: 0}
        active_peers: {type: integer, minimum: 0}
        total_bytes_sent: {type: integer, format: int64, minimum: 0}
        total_bytes_received: {type: integer, format: int64, minimum: 0}
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [registered_devices, connected_devices, max_devices, available_devices, plan_slug, plan_name, traffic, recent_sessions]
      properties:
        registered_devices: {type: integer, minimum: 0}
        connected_devices: {type: integer, minimum: 0}
        max_devices: {type: integer, minimum: 1}
        available_devices: {type: integer, minimum: 0}
        plan_slug: {type: string, minLength: 1}
        plan_name: {type: string, minLength: 1}
        traffic: {$ref: '#/components/schemas/DashboardTraffic'}
        recent_sessions:
          type: array
          maxItems: 6
          items: {$ref: '#/components/schemas/DashboardRecentSession'}
        infrastructure: {$ref: '#/components/schemas/DashboardInfrastructure'}
    DashboardSummaryEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/DashboardSummary'}
    ConnectionConfigurationEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/ConnectionConfiguration'}
      additionalProperties: false
    TunnelCredentialRequest:
      type: object
      additionalProperties: false
      required: [peer_id]
      properties: {peer_id: {type: string, format: uuid}}
    ProxyCredentialRequest:
      type: object
      additionalProperties: false
      required: [server_id, device]
      properties:
        server_id: {type: string, format: uuid}
        device: {$ref: '#/components/schemas/DeviceRegistration'}
    TransportCredential:
      type: string
      pattern: '^mvpn2\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{86}$'
      writeOnly: true
      x-midorivpn-sensitive: true
      description: Opaque Ed25519 credential bound to its audience, user, device, server and cluster.
    ProxyEndpoint:
      type: object
      additionalProperties: false
      required: [server_id, host, port, country_code, location]
      properties:
        server_id: {type: string, format: uuid}
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
        country_code: {type: string, minLength: 2, maxLength: 2}
        location: {type: string, minLength: 1, maxLength: 128}
    ProxyCredentialResult:
      type: object
      additionalProperties: false
      required: [proxy_token, expires_in, device_id, proxy_endpoint]
      properties:
        proxy_token: {$ref: '#/components/schemas/TransportCredential'}
        expires_in: {type: integer, minimum: 1, maximum: 900}
        device_id: {type: string, format: uuid}
        proxy_endpoint: {$ref: '#/components/schemas/ProxyEndpoint'}
    ProxyCredentialEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/ProxyCredentialResult'}
    TunnelCredentialResult:
      type: object
      additionalProperties: false
      required: [tunnel_token, expires_in]
      properties:
        tunnel_token: {$ref: '#/components/schemas/TransportCredential'}
        expires_in: {type: integer, minimum: 1, maximum: 900}
    TunnelCredentialEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/TunnelCredentialResult'}
    CertificateEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [server_id, csr_pem]
      anyOf:
        - required: [device]
        - required: [device_name]
      properties:
        server_id: {type: string, format: uuid}
        device_name:
          type: string
          maxLength: 64
          deprecated: true
        device: {$ref: '#/components/schemas/DeviceRegistration'}
        csr_pem: {type: string, writeOnly: true}
    MeshCreateRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 80}
        description: {type: string}
        max_members: {type: integer, minimum: 1, maximum: 250, default: 10}
        invite_expires_in_hours: {type: integer}
    MeshJoinRequest:
      type: object
      required: [invite_code]
      properties: {invite_code: {type: string, format: uuid, writeOnly: true}}
    MeshInviteRequest:
      type: object
      properties: {invite_expires_in_hours: {type: integer}}
    MeshIDRequest:
      type: object
      required: [mesh_id]
      properties: {mesh_id: {type: string, format: uuid}}
    ExitNodeRegistrationRequest:
      allOf:
        - {$ref: '#/components/schemas/MeshIDRequest'}
        - type: object
          required: [proxy_port, supports_tcp]
          properties:
            proxy_scheme: {type: string, enum: [http-connect, socks5], default: http-connect}
            proxy_port: {type: integer, minimum: 1, maximum: 65535}
            supports_tcp: {type: boolean, const: true}
            supports_udp: {type: boolean}
    ExitNodeSelectionRequest:
      type: object
      required: [mesh_ip, proxy_port]
      properties:
        mesh_ip: {type: string}
        proxy_scheme: {type: string, enum: [http-connect, socks5], default: http-connect}
        proxy_port: {type: integer, minimum: 1, maximum: 65535}
    AdminUserCreateRequest:
      type: object
      required: [authentik_uid, email]
      properties:
        authentik_uid: {type: string}
        email: {type: string, format: email}
        display_name: {type: string}
        groups: {type: array, items: {type: string}}
    AdminUserUpdateRequest:
      type: object
      properties:
        email: {type: string, format: email}
        display_name: {type: string}
        groups: {type: array, items: {type: string}}
    BanUserRequest:
      type: object
      properties: {reason: {type: string}}
    TransportRequest:
      type: object
      required: [protocol, host, port]
      properties:
        protocol: {type: string}
        host: {type: string}
        port: {type: integer, minimum: 1, maximum: 65535}
        enabled: {type: boolean}
        priority: {type: integer}
        metadata: {type: object, additionalProperties: true}
    EdgeProbeURL:
      type: string
      format: uri
      pattern: '^https://[^/?#\s]+/\.well-known/midorivpn/edge-health$'
    ServerCreateRequest:
      type: object
      required: [name, host, probe_url, public_key, transports]
      properties:
        name: {type: string}
        host: {type: string}
        probe_url: {$ref: '#/components/schemas/EdgeProbeURL'}
        endpoint: {type: string}
        port: {type: integer}
        wg_port: {type: integer}
        public_key: {type: string}
        location: {type: string}
        country_code: {type: string, minLength: 2, maxLength: 2}
        max_peers: {type: integer}
        transports: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TransportRequest'}}
    ServerUpdateRequest:
      type: object
      properties:
        name: {type: string}
        host: {type: string}
        probe_url: {$ref: '#/components/schemas/EdgeProbeURL'}
        endpoint: {type: string}
        port: {type: integer}
        wg_port: {type: integer}
        public_key: {type: string}
        location: {type: string}
        country_code: {type: string, minLength: 2, maxLength: 2}
        max_peers: {type: integer}
        transports: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TransportRequest'}}
        is_active: {type: boolean}
    NodeIdentityRequest:
      type: object
      required: [node_id, public_key]
      properties:
        node_id: {type: string}
        public_key: {type: string, writeOnly: true}
    NodeEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [node_id, public_key]
      properties:
        node_id: {type: string, format: uuid}
        public_key:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    NodeEnrollmentResult:
      type: object
      additionalProperties: false
      required: [node_id, status]
      properties:
        node_id: {type: string, format: uuid}
        status: {const: enrolled}
    NodeEnrollmentEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/NodeEnrollmentResult'}
    NodeHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [schema_version, core_version, health_status, current_peers, max_peers, version_compatible, transport_states, reported_at]
      properties:
        schema_version: {type: integer, const: 1}
        applied_revision: {type: integer, format: int64, minimum: 1}
        core_version: {type: string, minLength: 1, maxLength: 64}
        health_status: {type: string, enum: [unknown, healthy, degraded, error]}
        current_peers: {type: integer, minimum: 0}
        max_peers: {type: integer, minimum: 0}
        version_compatible: {type: boolean}
        transport_states:
          type: object
          maxProperties: 6
          additionalProperties:
            type: object
            additionalProperties: false
            required: [status, certified]
            properties:
              status: {type: string, enum: [unknown, healthy, degraded, error, disabled]}
              certified: {type: boolean}
        last_error_code: {type: string, pattern: '^[a-z0-9_]{1,64}$'}
        reported_at: {type: string, format: date-time}
    DesiredStateEndpoint:
      type: object
      additionalProperties: false
      required: [name, host, port]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        host: {type: string, minLength: 1, maxLength: 253}
        port: {type: integer, minimum: 1, maximum: 65535}
    DesiredStateCapacity:
      type: object
      additionalProperties: false
      required: [max_peers]
      properties:
        max_peers: {type: integer, minimum: 1, maximum: 65536}
    DesiredStateTransport:
      type: object
      additionalProperties: false
      required: [protocol, enabled, priority, endpoint, secret_references]
      properties:
        protocol: {type: string, enum: [wireguard, wss, masque, openvpn, ikev2, proxy]}
        enabled: {type: boolean}
        priority: {type: integer, minimum: 0, maximum: 1000}
        endpoint: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        secret_references:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
    DesiredStateSecretReference:
      type: object
      additionalProperties: false
      required: [name, fingerprint_sha256]
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        fingerprint_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    DesiredStateBundle:
      type: object
      additionalProperties: false
      required: [schema_version, cluster_id, node_id, revision, previous_revision, issued_at, expires_at, minimum_core_version, management_endpoint, public_endpoints, capacity, transports, secret_references]
      properties:
        schema_version: {type: integer, const: 1}
        cluster_id: {type: string, format: uuid}
        node_id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 1}
        previous_revision: {type: [integer, 'null'], format: int64, minimum: 1}
        issued_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        minimum_core_version: {type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'}
        management_endpoint: {type: string, format: uri}
        public_endpoints: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/DesiredStateEndpoint'}}
        capacity: {$ref: '#/components/schemas/DesiredStateCapacity'}
        transports: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/DesiredStateTransport'}}
        secret_references: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/DesiredStateSecretReference'}}
    SignedDesiredState:
      type: object
      additionalProperties: false
      required: [bundle, signing_key_id, signature]
      properties:
        bundle: {$ref: '#/components/schemas/DesiredStateBundle'}
        signing_key_id: {type: string, minLength: 1, maxLength: 128}
        signature: {type: string, pattern: '^[A-Za-z0-9_-]{86}$'}
    SignedDesiredStateEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/SignedDesiredState'}
    DesiredStateCreateRequest:
      type: object
      additionalProperties: false
      required: [expected_previous_revision, minimum_core_version, public_endpoints, capacity, transports, secret_references]
      properties:
        expected_previous_revision: {type: [integer, 'null'], format: int64, minimum: 1}
        expires_in_seconds: {type: integer, minimum: 60, maximum: 86400, default: 900}
        minimum_core_version: {type: string, pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'}
        public_endpoints: {type: array, minItems: 1, maxItems: 16, items: {$ref: '#/components/schemas/DesiredStateEndpoint'}}
        capacity: {$ref: '#/components/schemas/DesiredStateCapacity'}
        transports: {type: array, maxItems: 6, items: {$ref: '#/components/schemas/DesiredStateTransport'}}
        secret_references: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/DesiredStateSecretReference'}}
    ClusterCreateRequest:
      type: object
      additionalProperties: false
      required: [name, region]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        region: {type: string, minLength: 1, maxLength: 64}
        policy_labels: {type: object, additionalProperties: {type: string}}
        is_principal: {type: boolean}
    CoreNodeCreateRequest:
      type: object
      additionalProperties: false
      required: [name, management_host]
      properties:
        name: {type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'}
        management_host: {type: string, minLength: 1, maxLength: 253}
    CoreNodeUpdateRequest:
      type: object
      additionalProperties: false
      required: [management_host]
      properties:
        management_host: {type: string, minLength: 1, maxLength: 253, pattern: '^[^[:space:]/?#@]+$'}
    NodeEnrollmentTokenIssueRequest:
      type: object
      additionalProperties: false
      properties:
        ttl_minutes: {type: integer, minimum: 1, maximum: 1440, default: 15}
    NodeEnrollmentTokenResult:
      type: object
      additionalProperties: false
      required: [node_id, token, expires_at]
      properties:
        node_id: {type: string, format: uuid}
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          writeOnly: true
          x-midorivpn-sensitive: true
        expires_at: {type: string, format: date-time}
    NodeEnrollmentTokenEnvelope:
      type: object
      additionalProperties: false
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/NodeEnrollmentTokenResult'}
    ExtensionOriginUpdateRequest:
      type: object
      additionalProperties: false
      required: [revoked]
      properties: {revoked: {type: boolean}}
  requestBodies:
    AddPeer: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AddPeerRequest'}}}}
    UpdatePeer: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdatePeerRequest'}}}}
    OAuthCallback: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthCallbackRequest'}}}}
    OAuthRefresh: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthRefreshRequest'}}}}
    OAuthLogout: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OAuthLogoutRequest'}}}}
    Connection: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConnectionRequest'}}}}
    TunnelCredential: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TunnelCredentialRequest'}}}}
    ProxyCredential: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProxyCredentialRequest'}}}}
    CertificateEnrollment: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CertificateEnrollmentRequest'}}}}
    DeviceUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeviceUpdateRequest'}}}}
    MeshCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MeshCreateRequest'}}}}
    MeshJoin: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MeshJoinRequest'}}}}
    MeshInvite: {required: false, content: {application/json: {schema: {$ref: '#/components/schemas/MeshInviteRequest'}}}}
    ExitNodeRegistration: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExitNodeRegistrationRequest'}}}}
    ExitNodeSelection: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExitNodeSelectionRequest'}}}}
    AdminUserCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserCreateRequest'}}}}
    AdminUserUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserUpdateRequest'}}}}
    BanUser: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BanUserRequest'}}}}
    ServerCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServerCreateRequest'}}}}
    ServerUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ServerUpdateRequest'}}}}
    NodeIdentity: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NodeIdentityRequest'}}}}
    NodeEnrollment: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NodeEnrollmentRequest'}}}}
    NodeHeartbeat: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NodeHeartbeatRequest'}}}}
    ClusterCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClusterCreateRequest'}}}}
    CoreNodeCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CoreNodeCreateRequest'}}}}
    CoreNodeUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CoreNodeUpdateRequest'}}}}
    NodeEnrollmentTokenIssue: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NodeEnrollmentTokenIssueRequest'}}}}
    DesiredStateCreate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DesiredStateCreateRequest'}}}}
    ExtensionOriginUpdate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExtensionOriginUpdateRequest'}}}}
  responses:
    OK:
      description: Successful JSON envelope.
      content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}
    Created:
      description: Created JSON envelope.
      content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}
    Accepted:
      description: Durable operation accepted and pending convergence.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content: {application/json: {schema: {$ref: '#/components/schemas/DurableOperationStatusEnvelope'}}}
    NodePeerProvision:
      description: Peer provisioning result. HTTP 201 is new; HTTP 200 is an idempotent replay.
      content: {application/json: {schema: {$ref: '#/components/schemas/NodePeerProvisionEnvelope'}}}
    NodePeer:
      description: Observed peer state tied to its provisioning operation.
      content: {application/json: {schema: {$ref: '#/components/schemas/NodePeerEnvelope'}}}
    NodePeerList:
      description: Complete observed peer list; observation failures return HTTP 503 instead of an empty array.
      content: {application/json: {schema: {$ref: '#/components/schemas/NodePeerListEnvelope'}}}
    NodeEnrollment:
      description: Node identity enrollment completed and the one-use credential consumed.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content: {application/json: {schema: {$ref: '#/components/schemas/NodeEnrollmentEnvelope'}}}
    NodeEnrollmentToken:
      description: One-time plaintext enrollment credential. Control stores only its SHA-256 digest.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content: {application/json: {schema: {$ref: '#/components/schemas/NodeEnrollmentTokenEnvelope'}}}
    SignedDesiredState:
      description: Canonical desired state signed by Control with Ed25519 under a dedicated domain.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
      content: {application/json: {schema: {$ref: '#/components/schemas/SignedDesiredStateEnvelope'}}}
    HealthOK:
      description: Core process health.
      content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}
    EdgeHealth:
      description: Edge is reachable. The response has no body.
      headers:
        Cache-Control: {schema: {type: string, const: no-store}}
        Pragma: {schema: {type: string, const: no-cache}}
