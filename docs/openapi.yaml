components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Authentik JWT or JWE
      description: >-
        Accounts are managed in Authentik. Protected HTTP endpoints and the
        authenticated WebSocket require a valid subject and the exact vpn-users
        group. Administrative access additionally requires vpn-admins; global
        admins or authentik Admins groups do not grant VPN administrator privileges.
    TunnelBearer:
      type: http
      scheme: bearer
      bearerFormat: Ed25519 mvpn2 credential
    EnrollmentBearer:
      type: http
      scheme: bearer
      bearerFormat: one-use Core node enrollment token
    NodeID:
      type: apiKey
      in: header
      name: X-Node-ID
    NodeTimestamp:
      type: apiKey
      in: header
      name: X-Node-Timestamp
    NodeNonce:
      type: apiKey
      in: header
      name: X-Node-Nonce
    NodeSignature:
      type: apiKey
      in: header
      name: X-Node-Signature
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    NodeID:
      name: nodeID
      in: path
      required: true
      schema: {type: string, minLength: 1}
    ClusterID:
      name: clusterID
      in: path
      required: true
      schema: {type: string, format: uuid}
    MeshID:
      name: meshID
      in: path
      required: true
      schema: {type: string, format: uuid}
    PublicKey:
      name: pubkey
      in: path
      required: true
      schema: {$ref: '#/components/schemas/WireGuardKey'}
    ExpectedOperationID:
      name: expected_operation_id
      in: query
      required: true
      description: Operation that must still own the peer before it can be removed.
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Search:
      name: search
      in: query
      description: Case-insensitive prefix search over the documented resource fields.
      schema: {type: string, maxLength: 128}
    Order:
      name: order
      in: query
      schema: {type: string, enum: [asc, desc], default: desc}
  schemas:
    SuccessEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {}
    ErrorEnvelope:
      type: object
      required: [ok, error, code]
      properties:
        ok: {const: false}
        error: {type: string}
        code:
          type: string
          description: Stable machine-readable identifier; clients must not branch on error prose.
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - gone
            - request_too_large
            - unsupported_media_type
            - unprocessable_entity
            - rate_limited
            - internal_error
            - not_implemented
            - bad_gateway
            - service_unavailable
            - gateway_timeout
            - request_failed
            - auth_provider_rejected
            - auth_provider_rate_limited
            - auth_provider_unavailable
            - oauth_invalid_grant
            - oauth_invalid_request
            - oauth_unauthorized_client
            - oauth_unsupported_grant_type
            - client_pki_unavailable
            - connection_in_progress
            - device_limit_reached
            - device_revoked
            - device_cleanup_pending
            - disconnect_pending
            - ban_cleanup_pending
            - active_devices_must_be_disconnected
            - server_not_drained
            - peer_operation_conflict
            - core_peer_state_unavailable
            - origin_country_unavailable
            - node_enrollment_unauthorized
            - node_authentication_failed
      additionalProperties: false
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          x-midorivpn-sensitive: true
        token_type: {type: string}
        expires_in: {type: integer}
        refresh_token:
          type: string
          x-midorivpn-sensitive: true
        id_token:
          type: string
          x-midorivpn-sensitive: true
    OIDCConfigurationEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data:
          type: object
          required: [issuer, authorization_endpoint, token_endpoint, client_id, redirect_uri]
          properties:
            issuer: {type: string, format: uri}
            authorization_endpoint: {type: string, format: uri}
            token_endpoint: {type: string, format: uri}
            userinfo_endpoint: {type: string, format: uri}
            end_session_endpoint: {type: string, format: uri}
            jwks_uri: {type: string, format: uri}
            client_id: {type: string}
            redirect_uri: {type: string, format: uri}
    AddPeerRequest:
      type: object
      additionalProperties: false
      required: [public_key, operation_id]
      properties:
        public_key: {$ref: '#/components/schemas/WireGuardKey'}
        operation_id: {type: string, format: uuid}
        preshared_key:
          allOf: [{$ref: '#/components/schemas/WireGuardKey'}]
          writeOnly: true
        keepalive: {type: integer, minimum: 1, maximum: 65535, default: 25}
    UpdatePeerRequest:
      type: object
      additionalProperties: false
      properties:
        keepalive: {type: integer, minimum: 0, maximum: 65535}
    WireGuardKey:
      type: string
      minLength: 44
      maxLength: 44
      pattern: '^[A-Za-z0-9+/]{43}=$'
      description: Canonical padded base64 encoding of exactly 32 bytes.
    NodePeerProvision:
      type: object
      additionalProperties: false
      required: [public_key, operation_id, allowed_ip, endpoint]
      properties:
        public_key: {$ref: '#/components/schemas/WireGuardKey'}
        operation_id: {type: string, format: uuid}
        allowed_ip: {type: string}
        endpoint: {type: string}
    NodePeer:
      type: object
      additionalProperties: false
      required: [public_key, operation_id, allowed_ip, keepalive, tx_bytes, rx_bytes]
      properties:
        public_key: {$ref: '#/components/schemas/WireGuardKey'}
        operation_id: {type: string, format: uuid}
        allowed_ip: {type: string}
        keepalive: {type: integer, minimum: 0, maximum: 65535}
        last_handshake: {type: string, format: date-time}
        tx_bytes: {type: integer, format: int64, minimum: 0}
        rx_bytes: {type: integer, format: int64, minimum: 0}
        endpoint: {type: string}
    NodePeerProvisionEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/NodePeerProvision'}
    NodePeerEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data: {$ref: '#/components/schemas/NodePeer'}
    NodePeerListEnvelope:
      type: object
      required: [ok, data]
      properties:
        ok: {const: true}
        data:
          type: array
          items: {$ref: '#/components/schemas/NodePeer'}
    OAuthCallbackRequest:
      type: object
      required: [code, redirect_uri]
      properties:
        code: {type: string, writeOnly: true}
        redirect_uri: {type: string, format: uri}
        code_verifier: {type: string, writeOnly: true}
    OAuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string, writeOnly: true}
    OAuthLogoutRequest:
      type: object
      properties:
        access_token: {type: string, writeOnly: true}
        refresh_token: {type: string, writeOnly: true}
    ConnectionRequest:
      type: object
      additionalProperties: false
      required: [public_key]
      anyOf:
        - required: [device]
        - required: [device_name]
      properties:
        server_id: {type: string, format: uuid}
        public_key: {$ref: '#/components/schemas/WireGuardKey'}
        device_name:
          type: string
          maxLength: 64
          deprecated: true
          description: Transitional identity for clients without a persistent installation UUID.
        device: {$ref: '#/components/schemas/DeviceRegistration'}
        connection_reason:
          type: string
          enum: [user, automatic_failover]
          default: user
          description: Records whether the client initiated a normal connection or an automatic failover without changing device identity.
        pq_kem_public_key: {type: string, writeOnly: true}
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [client_instance_id, reported_name, device_type]
      properties:
        client_instance_id: {type: string, format: uuid}
        reported_name: {type: string, minLength: 1, maxLength: 64}
        device_type: {type: string, enum: [desktop, extension, manual, mobile]}
        adapter_reference:
          type: string
          pattern: '^net-v1:[A-Za-z0-9_-]{43}$'
          description: Private secondary HMAC reference; never a raw MAC or unique identity key.
    Device:
      type: object
      additionalProperties: false
      required: [id, client_instance_id, reported_name, alias, display_name, device_type, adapter_reference, adapter_label, first_seen_at, last_seen_at, revoked_at, status, active_connection]
      properties:
        id: {type: string, format: uuid}
        client_instance_id:
          type: [string, 'null']
          format: uuid
          description: Null only for safely isolated historical clients.
        reported_name: {type: string, minLength: 1, maxLength: 64}
        alias: {type: string, maxLength: 64}
        display_name: {type: string, minLength: 1, maxLength: 64}
        device_type: {type: string, enum: [desktop, extension, manual, mobile]}
        adapter_reference:
          type: string
          pattern: '^(net-v1:[A-Za-z0-9_-]{43})?$'
        adapter_label: {type: string, pattern: '^(LAN · [A-F0-9]{8})?$'}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        status:
          type: string
          enum: [connected, disconnected, connecting, disconnecting, cleanup_pending, revoked]
        active_connection:
          oneOf:
            - {$ref: '#/components/schemas/DeviceConnection'}
            - {type: 'null'}
    DeviceConnection:
      type: object
      additionalProperties: false
      required: [id, device_id, server_id, protocol, public_key, assigned_ip, is_active, bytes_sent, bytes_received, last_handshake, created_at, expires_at]
