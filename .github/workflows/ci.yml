name: CI - Core Server

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test & Quality Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./cmd/... ./internal/...

      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./cmd/... ./internal/...

      - name: Run Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./cmd/... ./internal/...

      - name: Run unit tests with Race Detector
        run: go test -v -race ./internal/...

      - name: Build binary check
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -v -o /tmp/vpn-core ./cmd/vpn-core
