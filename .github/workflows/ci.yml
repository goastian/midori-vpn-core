name: CI - Core Server

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test & Quality Check
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgres://midori:midori-test-only@127.0.0.1:5432/midori_vpn?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: midori
          POSTGRES_PASSWORD: midori-test-only
          POSTGRES_DB: midori_vpn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U midori -d midori_vpn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./cmd/... ./internal/...

      - name: Run Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./cmd/... ./internal/...

      - name: Run Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./cmd/... ./internal/...

      - name: Run unit and integration tests with Race Detector
        run: |
          set -euo pipefail
          go test -json -race ./cmd/... ./internal/... | tee "$RUNNER_TEMP/core-tests.jsonl"
          jq -e -s '
            any(.[]; .Package == "github.com/goastian/midori-vpn-core/internal/repo" and .Action == "pass" and has("Test")) and
            any(.[]; .Package == "github.com/goastian/midori-vpn-core/internal/control" and .Action == "pass" and has("Test")) and
            all(.[]; .Action != "skip" or
              (.Package != "github.com/goastian/midori-vpn-core/internal/repo" and
               .Package != "github.com/goastian/midori-vpn-core/internal/control"))
          ' "$RUNNER_TEMP/core-tests.jsonl"

      - name: Build binary check
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -v -o /tmp/vpn-core ./cmd/vpn-core
