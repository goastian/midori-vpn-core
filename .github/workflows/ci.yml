name: CI - Core Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./cmd/... ./internal/...

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.1"
          install-go: false

      - name: Run Govulncheck
        uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: '1.27.x'
          go-package: ./cmd/... ./internal/...

      - name: Run unit tests with Race Detector
        run: go test -v -race ./internal/...

      - name: Build binary check
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -v -o /tmp/vpn-core ./cmd/vpn-core
