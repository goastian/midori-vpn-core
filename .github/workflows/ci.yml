name: CI - Core Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run unit tests with Race Detector
        run: go test -v -race ./internal/...

      - name: Build binary check
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -v -o /tmp/vpn-core ./cmd/vpn-core
