name: Publish - coordinated private OCI candidate

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: midorivpn-${{ github.ref_name }}-private-candidate
  cancel-in-progress: false

env:
  CORE_IMAGE: ghcr.io/goastian/midori-vpn-core
  CONTROL_IMAGE: ghcr.io/goastian/midori-vpn-control
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  validate-release-set:
    name: Validate all four private annotated candidate tags and commits
    if: github.repository == 'goastian/midori-vpn-core-dev'
    runs-on: ubuntu-24.04
    steps:
      - name: Require the private candidate switch
        env:
          CANDIDATE_PUBLISH_ENABLED: ${{ vars.MIDORIVPN_PRIVATE_CANDIDATE_ENABLED }}
        run: test "$CANDIDATE_PUBLISH_ENABLED" = true

      - name: Checkout Core tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Control tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: goastian/midori-vpn-control-dev
          ref: ${{ github.ref_name }}
          path: midori-vpn-control
          token: ${{ secrets.MIDORIVPN_RELEASE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Desktop tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: goastian/midori-vpn-desktop-dev
          ref: ${{ github.ref_name }}
          path: midori-vpn-desktop
          token: ${{ secrets.MIDORIVPN_RELEASE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Extension tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: goastian/midorivpn-extension-dev
          ref: ${{ github.ref_name }}
          path: midorivpn-extension
          token: ${{ secrets.MIDORIVPN_RELEASE_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create the authoritative coordinated manifest
        run: bash scripts/release/verify-coordinated-tags.sh "$GITHUB_REF_NAME" dist-release/workspace-manifest.json

      - name: Retain the validated source manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: midorivpn-${{ github.ref_name }}-source-manifest
          path: dist-release/workspace-manifest.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish private Core candidate and coordinate the release bundle
    needs: validate-release-set
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      core_digest: ${{ steps.push.outputs.digest }}
      control_digest: ${{ steps.control.outputs.digest }}
    steps:
      - name: Checkout the approved Core tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the coordinated source manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: midorivpn-${{ github.ref_name }}-source-manifest
          path: dist-release

      - name: Define and revalidate release inputs
        env:
          RELEASE_READ_USER: ${{ vars.MIDORIVPN_RELEASE_READ_USER }}
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_READ_USER" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,78}$ ]]
          product_version="$(cat VERSION)"
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" == "$product_version" || "$release_version" == "$product_version"-* ]]
          test "$(jq -r .product_version dist-release/workspace-manifest.json)" = "$product_version"
          test "$(jq -r .release_version dist-release/workspace-manifest.json)" = "$release_version"
          test "$(jq -r .git_tag dist-release/workspace-manifest.json)" = "$GITHUB_REF_NAME"
          test "$(jq -r '.repositories[] | select(.component == "core") | .commit' dist-release/workspace-manifest.json)" = "$GITHUB_SHA"
          {
            printf 'PRODUCT_VERSION=%s\n' "$product_version"
            printf 'RELEASE_VERSION=%s\n' "$release_version"
            printf 'SOURCE_DATE_EPOCH=%s\n' "$(jq -r .source_date_epoch dist-release/workspace-manifest.json)"
            printf 'BUILD_STARTED_ON=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR for private dependency verification
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ vars.MIDORIVPN_RELEASE_READ_USER }}
          password: ${{ secrets.MIDORIVPN_RELEASE_READ_TOKEN }}

      - name: Set up current pinned Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install current pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Pull and verify the matching private Control tag
        id: control
        env:
          GH_TOKEN: ${{ secrets.MIDORIVPN_RELEASE_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          tag_ref="${CONTROL_IMAGE}:${RELEASE_VERSION}"
          verification_ref=""
          for _ in $(seq 1 40); do
            if docker pull "$tag_ref" >/dev/null 2>&1; then
              verification_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag_ref" | grep -E '^ghcr\.io/goastian/midori-vpn-control@sha256:[0-9a-f]{64}$' | head -1)"
            fi
            [[ "$verification_ref" =~ @sha256:[0-9a-f]{64}$ ]] && break
            sleep 30
          done
          [[ "$verification_ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo 'error: matching Control release did not become available' >&2; exit 1; }
          digest="${verification_ref##*@}"
          test "$(gh api /orgs/goastian/packages/container/midori-vpn-control --jq .visibility)" = private
          expected_commit="$(jq -r '.repositories[] | select(.component == "control") | .commit' dist-release/workspace-manifest.json)"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$tag_ref")" = "$expected_commit"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$tag_ref")" = "$RELEASE_VERSION"
          identity="https://github.com/goastian/midori-vpn-control-dev/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$verification_ref"
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$verification_ref" >/dev/null
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$verification_ref" >/dev/null
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for Core publication
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace an existing Core version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          error_file="$(mktemp)"
          if existing_tags="$(gh api --paginate '/orgs/goastian/packages/container/midori-vpn-core/versions?per_page=100' --jq '.[].metadata.container.tags[]?' 2>"$error_file")"; then
            :
          elif grep -Fq 'HTTP 404' "$error_file"; then
            existing_tags=""
          else
            echo 'error: unable to establish whether the Core version already exists' >&2
            exit 1
          fi
          if grep -Fxq "$RELEASE_VERSION" <<< "$existing_tags"; then
            echo 'error: immutable Core version already exists' >&2
            exit 1
          fi

      - name: First clean Core OCI build
        id: first
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: ${{ env.CORE_IMAGE }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/goastian/midori-vpn-core-dev
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=oci,dest=${{ runner.temp }}/core-first.oci.tar,rewrite-timestamp=true
          provenance: false
          sbom: false

      - name: Second clean Core OCI build
        id: second
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: ${{ env.CORE_IMAGE }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/goastian/midori-vpn-core-dev
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=oci,dest=${{ runner.temp }}/core-second.oci.tar,rewrite-timestamp=true
          provenance: false
          sbom: false

      - name: Require reproducible Core image digests
        env:
          FIRST_DIGEST: ${{ steps.first.outputs.digest }}
          SECOND_DIGEST: ${{ steps.second.outputs.digest }}
        run: test -n "$FIRST_DIGEST" && test "$FIRST_DIGEST" = "$SECOND_DIGEST"

      - name: Push the rebuilt immutable Core tag
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          no-cache: true
          tags: ${{ env.CORE_IMAGE }}:${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/goastian/midori-vpn-core-dev
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          outputs: type=registry,rewrite-timestamp=true
          provenance: false
          sbom: false

      - name: Require the pushed digest to match both clean builds
        env:
          FIRST_DIGEST: ${{ steps.first.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: test -n "$PUSHED_DIGEST" && test "$FIRST_DIGEST" = "$PUSHED_DIGEST"

      - name: Verify private Core package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api /orgs/goastian/packages/container/midori-vpn-core --jq .visibility)" = private

      - name: Scan the exact Core digest and generate independent SPDX
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          CONTAINER_ENGINE=docker bash scripts/scan-oci.sh image \
            "${CORE_IMAGE}@${IMAGE_DIGEST}" "dist-release/core-${RELEASE_VERSION}.trivy.json"
          docker run --rm -e SYFT_CACHE_DIR=/tmp/syft-cache -e DOCKER_CONFIG=/auth \
            -v "${HOME}/.docker/config.json:/auth/config.json:ro" \
            -v "${PWD}/dist-release:/artifacts" \
            ghcr.io/anchore/syft@sha256:03215d0e98b661d0ecbc8575dbc14d65be1743b5de5df6410aecb7e80f95b060 \
            scan "registry:${CORE_IMAGE}@${IMAGE_DIGEST}" \
            -o "spdx-json=/artifacts/core-${RELEASE_VERSION}.spdx.json"
          jq -n \
            --arg server "$GITHUB_SERVER_URL" --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF" --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg product_version "$PRODUCT_VERSION" --arg release_version "$RELEASE_VERSION" \
            --arg started_on "$BUILD_STARTED_ON" --arg finished_on "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{buildDefinition:{buildType:"https://slsa-framework.github.io/github-actions-buildtypes/workflow/v1",externalParameters:{workflow:{ref:$ref,repository:($server+"/"+$repository),path:".github/workflows/publish.yml"},product_version:$product_version,release_version:$release_version},internalParameters:{github:{event_name:"push",runner_environment:"github-hosted"}},resolvedDependencies:[{uri:("git+"+$server+"/"+$repository+"@"+$ref),digest:{gitCommit:$commit}}]},runDetails:{builder:{id:($server+"/actions/runner/github-hosted")},metadata:{invocationId:($server+"/"+$repository+"/actions/runs/"+$run_id+"/attempts/"+$run_attempt),startedOn:$started_on,finishedOn:$finished_on},byproducts:[]}}' \
            > "dist-release/core-${RELEASE_VERSION}.provenance.json"

      - name: Sign, attest, pull by tag and verify Core
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -Eeuo pipefail
          tag_ref="${CORE_IMAGE}:${RELEASE_VERSION}"
          verification_ref="${CORE_IMAGE}@${IMAGE_DIGEST}"
          identity="https://github.com/goastian/midori-vpn-core-dev/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}"
          cosign sign --yes "$verification_ref"
          cosign attest --yes --type slsaprovenance1 \
            --predicate "dist-release/core-${RELEASE_VERSION}.provenance.json" "$verification_ref"
          cosign attest --yes --type spdxjson \
            --predicate "dist-release/core-${RELEASE_VERSION}.spdx.json" "$verification_ref"
          docker pull "$tag_ref" >/dev/null
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$tag_ref" | grep -Fx "$verification_ref"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$tag_ref")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$tag_ref")" = "$RELEASE_VERSION"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$verification_ref"
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$verification_ref" > "dist-release/core-${RELEASE_VERSION}.provenance.verify.json"
          cosign verify-attestation --type spdxjson \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$verification_ref" > "dist-release/core-${RELEASE_VERSION}.spdx.verify.json"
          jq -e --arg commit "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg version "$RELEASE_VERSION" '
            def records: if type == "array" then .[] else . end;
            any(records; ((.payload | @base64d | fromjson).predicate) as $p |
              $p.buildDefinition.externalParameters.workflow.ref == $ref and
              $p.buildDefinition.externalParameters.release_version == $version and
              $p.buildDefinition.resolvedDependencies[0].digest.gitCommit == $commit)
          ' "dist-release/core-${RELEASE_VERSION}.provenance.verify.json" >/dev/null
          jq -e '
            def records: if type == "array" then .[] else . end;
            any(records; (.payload | @base64d | fromjson).predicate.spdxVersion == "SPDX-2.3")
          ' "dist-release/core-${RELEASE_VERSION}.spdx.verify.json" >/dev/null

      - name: Create the secret-free deployment bundle
        env:
          CORE_DIGEST: ${{ steps.push.outputs.digest }}
          CONTROL_DIGEST: ${{ steps.control.outputs.digest }}
        run: |
          bash scripts/release/create-deployment-bundle.sh \
            --manifest dist-release/workspace-manifest.json \
            --core-digest "$CORE_DIGEST" --control-digest "$CONTROL_DIGEST" \
            --output-dir "dist-release/midorivpn-${RELEASE_VERSION}"

      - name: Retain private supply-chain evidence and deployment bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: midorivpn-${{ github.ref_name }}-deployment-bundle
          path: |
            dist-release/midorivpn-${{ env.RELEASE_VERSION }}.tar.gz
            dist-release/midorivpn-${{ env.RELEASE_VERSION }}.tar.gz.sha256
            dist-release/workspace-manifest.json
            dist-release/core-${{ env.RELEASE_VERSION }}.provenance.json
            dist-release/core-${{ env.RELEASE_VERSION }}.provenance.verify.json
            dist-release/core-${{ env.RELEASE_VERSION }}.spdx.json
            dist-release/core-${{ env.RELEASE_VERSION }}.spdx.verify.json
            dist-release/core-${{ env.RELEASE_VERSION }}.trivy.json
          if-no-files-found: error
          retention-days: 30
