name: Deploy - verified private candidate

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: midorivpn-${{ github.ref_name }}-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy after protected public-repository approval
    if: github.repository == 'goastian/midori-vpn-core'
    runs-on: ubuntu-24.04
    environment:
      name: deploy-production
    steps:
      - name: Checkout the public production tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate protected deployment inputs
        env:
          DEPLOY_ENABLED: ${{ vars.MIDORIVPN_DEPLOY_ENABLED }}
          DEPLOY_HOST: ${{ vars.MIDORIVPN_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.MIDORIVPN_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.MIDORIVPN_DEPLOY_USER }}
          DEPLOY_SERVICE_USER: ${{ vars.MIDORIVPN_DEPLOY_SERVICE_USER }}
          DEPLOY_VALUES: ${{ vars.MIDORIVPN_DEPLOY_VALUES }}
          DEPLOY_SECRETS: ${{ secrets.MIDORIVPN_DEPLOY_SECRETS }}
          SSH_PRIVATE_KEY: ${{ secrets.MIDORIVPN_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MIDORIVPN_DEPLOY_SSH_KNOWN_HOSTS }}
          GHCR_PULL_USER: ${{ vars.MIDORIVPN_GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.MIDORIVPN_GHCR_PULL_TOKEN }}
          PRIVATE_RELEASE_TOKEN: ${{ secrets.MIDORIVPN_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          test "$DEPLOY_ENABLED" = true
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{}")" = "$GITHUB_SHA"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          [[ "$DEPLOY_SERVICE_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]
          test "$DEPLOY_SERVICE_USER" != root
          [[ "$GHCR_PULL_USER" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,78}$ ]]
          test -n "$DEPLOY_VALUES" && test -n "$DEPLOY_SECRETS"
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          test -n "$GHCR_PULL_TOKEN" && test -n "$PRIVATE_RELEASE_TOKEN"

      - name: Download the matching private candidate bundle
        env:
          GH_TOKEN: ${{ secrets.MIDORIVPN_PRIVATE_RELEASE_TOKEN }}
        run: |
          set -Eeuo pipefail
          run_id="$(gh run list --repo goastian/midori-vpn-core-dev --workflow publish.yml \
            --branch "$GITHUB_REF_NAME" --event push --status success --limit 20 \
            --json databaseId,headBranch \
            --jq 'map(select(.headBranch == env.GITHUB_REF_NAME)) | first | .databaseId')"
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh run download "$run_id" --repo goastian/midori-vpn-core-dev \
            --name "midorivpn-${GITHUB_REF_NAME}-deployment-bundle" \
            --dir release-artifact

      - name: Expand and validate the coordinated bundle
        env:
          DEPLOY_VALUES: ${{ vars.MIDORIVPN_DEPLOY_VALUES }}
          DEPLOY_SECRETS: ${{ secrets.MIDORIVPN_DEPLOY_SECRETS }}
        run: |
          set -Eeuo pipefail
          umask 077
          release_version="${GITHUB_REF_NAME#v}"
          (cd release-artifact && sha256sum --check "midorivpn-${release_version}.tar.gz.sha256")
          mkdir -m 700 release-expanded
          tar -xzf "release-artifact/midorivpn-${release_version}.tar.gz" -C release-expanded
          bundle="release-expanded/midorivpn-${release_version}"
          test "$(jq -r .git_tag "$bundle/release.json")" = "$GITHUB_REF_NAME"
          test "$(jq -r .release_version "$bundle/release.json")" = "$release_version"
          test "$(jq -r '.repositories[] | select(.component == "core") | .commit' "$bundle/workspace-manifest.json")" = "$GITHUB_SHA"
          printf '%s\n' "$DEPLOY_VALUES" > "$RUNNER_TEMP/deploy-values.env"
          printf '%s\n' "$DEPLOY_SECRETS" > "$RUNNER_TEMP/deploy-secrets.env"
          bash "$bundle/scripts/release/compose-deployment-values.sh" \
            --variables-file "$RUNNER_TEMP/deploy-values.env" \
            --secrets-file "$RUNNER_TEMP/deploy-secrets.env" \
            --core-image "$(jq -r .images.core.pull_ref "$bundle/release.json")" \
            --control-image "$(jq -r .images.control.pull_ref "$bundle/release.json")" \
            --output "$RUNNER_TEMP/deployment.env"
          printf 'BUNDLE_DIR=%s\n' "$bundle" >> "$GITHUB_ENV"
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"

      - name: Log in to private GHCR for verification
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ vars.MIDORIVPN_GHCR_PULL_USER }}
          password: ${{ secrets.MIDORIVPN_GHCR_PULL_TOKEN }}

      - name: Install current pinned Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Resolve tags and verify signatures, provenance and SBOM
        run: |
          set -Eeuo pipefail
          CONTAINER_ENGINE=docker bash "$BUNDLE_DIR/scripts/release/resolve-runtime-images.sh" \
            --env-file "$RUNNER_TEMP/deployment.env" \
            --release-json "$BUNDLE_DIR/release.json" \
            --workspace-manifest "$BUNDLE_DIR/workspace-manifest.json" \
            --output "$RUNNER_TEMP/runtime-images.json"
          CONTAINER_ENGINE=docker bash "$BUNDLE_DIR/scripts/release/verify-oci-release.sh" \
            core "$BUNDLE_DIR/release.json" "$BUNDLE_DIR/workspace-manifest.json"
          if grep -Fxq 'DEPLOYMENT_PROFILE=principal' "$RUNNER_TEMP/deployment.env"; then
            CONTAINER_ENGINE=docker bash "$BUNDLE_DIR/scripts/release/verify-oci-release.sh" \
              control "$BUNDLE_DIR/release.json" "$BUNDLE_DIR/workspace-manifest.json"
          fi

      - name: Install strict SSH trust material
        env:
          DEPLOY_HOST: ${{ vars.MIDORIVPN_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.MIDORIVPN_DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.MIDORIVPN_DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MIDORIVPN_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/known_hosts"
          lookup="$DEPLOY_HOST"
          [[ "$DEPLOY_PORT" == 22 ]] || lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"
          ssh-keygen -F "$lookup" -f "$RUNNER_TEMP/known_hosts" >/dev/null

      - name: Transfer, authenticate by stdin and deploy
        env:
          DEPLOY_HOST: ${{ vars.MIDORIVPN_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.MIDORIVPN_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.MIDORIVPN_DEPLOY_USER }}
          DEPLOY_SERVICE_USER: ${{ vars.MIDORIVPN_DEPLOY_SERVICE_USER }}
          GHCR_PULL_USER: ${{ vars.MIDORIVPN_GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.MIDORIVPN_GHCR_PULL_TOKEN }}
        run: |
          set -Eeuo pipefail
          # All variables in the quoted remote commands are intentionally
          # validated and expanded on this trusted runner.
          remote_dir="/tmp/midorivpn-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh_opts=(-i "$RUNNER_TEMP/deploy-key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts")
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "install -d -m 700 '$remote_dir'"
          scp -i "$RUNNER_TEMP/deploy-key" -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
            "release-artifact/midorivpn-${RELEASE_VERSION}.tar.gz" "release-artifact/midorivpn-${RELEASE_VERSION}.tar.gz.sha256" \
            "$RUNNER_TEMP/deployment.env" "$RUNNER_TEMP/runtime-images.json" \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_dir/"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 '$remote_dir/deployment.env' '$remote_dir/runtime-images.json'"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$remote_dir' && sha256sum --check 'midorivpn-${RELEASE_VERSION}.tar.gz.sha256' && tar -xzf 'midorivpn-${RELEASE_VERSION}.tar.gz' && sudo bash 'midorivpn-${RELEASE_VERSION}/deploy/host/prepare-opensuse.sh' --apply --service-user '$DEPLOY_SERVICE_USER'"
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_PULL_TOKEN" | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "service_home=\$(getent passwd '$DEPLOY_SERVICE_USER' | cut -d: -f6); sudo -u '$DEPLOY_SERVICE_USER' env HOME=\"\$service_home\" podman login --username '$GHCR_PULL_USER' --password-stdin ghcr.io"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo bash '$remote_dir/midorivpn-${RELEASE_VERSION}/scripts/release/apply-deployment.sh' --bundle-dir '$remote_dir/midorivpn-${RELEASE_VERSION}' --values-file '$remote_dir/deployment.env' --image-lock '$remote_dir/runtime-images.json' --service-user '$DEPLOY_SERVICE_USER' --deployment-id '${RELEASE_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"
          # shellcheck disable=SC2029
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '$remote_dir'"

      - name: Remove remote staging after success or failure
        if: always()
        env:
          DEPLOY_HOST: ${{ vars.MIDORIVPN_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.MIDORIVPN_DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.MIDORIVPN_DEPLOY_USER }}
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/deploy-key" && "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then
            remote_dir="/tmp/midorivpn-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            ssh -i "$RUNNER_TEMP/deploy-key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" \
              "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '$remote_dir'"
          fi

      - name: Remove runner secrets
        if: always()
        run: rm -f -- "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/deploy-values.env" "$RUNNER_TEMP/deploy-secrets.env" "$RUNNER_TEMP/deployment.env" "$RUNNER_TEMP/runtime-images.json"
