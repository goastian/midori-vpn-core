groups:
  - name: midorivpn-core
    rules:
      - alert: MidoriVPNCoreDown
        expr: up{job=~"midorivpn-(principal|regional)-core"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: MidoriVPN Core is not being scraped
          description: The private Prometheus target has been unavailable for two minutes.

      - alert: MidoriVPNNodeHeartbeatStale
        expr: time() - midori_vpn_node_last_seen_timestamp_seconds > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Regional Core heartbeat is stale
          description: Node {{ $labels.node }} in cluster {{ $labels.cluster }} has not delivered a current signed heartbeat.

      - alert: MidoriVPNNodeRevisionDrift
        expr: midori_vpn_node_revision_drift > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Regional Core desired and observed revisions differ
          description: Node {{ $labels.node }} has not converged to the latest desired revision.

      - alert: MidoriVPNNodeVersionIncompatible
        expr: midori_vpn_node_version_compatible == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Regional Core version is incompatible
          description: Node {{ $labels.node }} does not satisfy the current desired-state version requirement.

      - alert: MidoriVPNDesiredStateSignatureRejected
        expr: midori_vpn_node_desired_signature_error > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Regional Core rejected the desired-state signature
          description: Node {{ $labels.node }} reported a desired-state signature failure; placement must remain closed.

      - alert: MidoriVPNNodeAuthenticationFailures
        expr: increase(midori_vpn_node_auth_failures_total{reason=~"invalid_signature|replay"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Signed node authentication was rejected
          description: A Core or Control endpoint rejected a signed request because its signature or nonce was invalid.

      - alert: MidoriVPNNodeReplayProtectionUnavailable
        expr: increase(midori_vpn_node_auth_failures_total{reason="unavailable"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Node replay protection is unavailable
          description: Signed management traffic is failing closed because its replay store cannot be used.

      - alert: MidoriVPNNodeCapacityHigh
        expr: midori_vpn_node_max_peers > 0 and midori_vpn_node_current_peers / midori_vpn_node_max_peers > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Regional Core peer capacity is above ninety percent
          description: Node {{ $labels.node }} is close to its observed peer capacity.

      - alert: MidoriVPNControlDatabaseUnavailable
        expr: midori_vpn_control_database_up{role="principal"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Control database metrics are unavailable
          description: Core could not read aggregate transport and capacity state from PostgreSQL.

      - alert: MidoriVPNElevatedServerErrors
        expr: rate(midori_vpn_http_5xx_total[5m]) / clamp_min(rate(midori_vpn_http_requests_total[5m]), 0.01) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MidoriVPN HTTP 5xx ratio is elevated
          description: More than five percent of API requests have failed with 5xx responses for ten minutes.

      - alert: MidoriVPNProvisioningFailures
        expr: increase(midori_vpn_connection_provision_failures_total[10m]) >= 3
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Repeated VPN peer provisioning failures
          description: At least three connection provisioning requests failed in the last ten minutes.

      - alert: MidoriVPNProvisioningLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, cluster) (rate(midori_vpn_connection_provision_duration_seconds_bucket[10m]))) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: VPN peer provisioning p95 is above two seconds
          description: Server-side peer provisioning has remained slow for ten minutes.

      - alert: MidoriVPNPeerStateDivergence
        expr: midori_vpn_reconciliation_divergent_peers > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: VPN peer state remains divergent
          description: PostgreSQL and at least one successfully observed Core have not converged for two minutes.

      - alert: MidoriVPNPeerCleanupPending
        expr: midori_vpn_reconciliation_cleanup_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: VPN peer cleanup remains pending
          description: At least one exact peer cleanup has not converged for five minutes.

      - alert: MidoriVPNPeerOperationsPending
        expr: midori_vpn_peer_operations_pending > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Durable VPN peer operations remain pending
          description: At least one connection or cleanup operation has remained unfinished for five minutes.

      - alert: MidoriVPNReconciliationObservationErrors
        expr: midori_vpn_reconciliation_observation_errors > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: VPN peer reconciliation cannot observe authoritative state
          description: Core or PostgreSQL observations have failed for two minutes; destructive convergence remains disabled.

      - alert: MidoriVPNServerCapacityHigh
        expr: midori_vpn_server_peer_capacity > 0 and midori_vpn_server_current_peers / midori_vpn_server_peer_capacity > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: MidoriVPN peer capacity is above ninety percent
          description: Active configured servers are close to their aggregate peer limit.

      - alert: MidoriVPNTransportUnavailable
        expr: sum by (cluster, protocol) (midori_vpn_transport_status) > 0 unless on (cluster, protocol) sum by (cluster, protocol) (midori_vpn_transport_status{status="healthy"}) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: An enabled VPN transport has no healthy server
          description: Protocol {{ $labels.protocol }} is enabled but no active server reports it healthy.
