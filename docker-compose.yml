name: vpn-core

services:
  vpn-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: goastian/vpn-core:latest
    restart: always
    # Host must pre-load the wireguard kernel module:
    #   modprobe wireguard  (or add to /etc/modules-load.d/wireguard.conf)
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    env_file:
      - .env
    ports:
      - "8085:8080/tcp"
      - "8888:8888/tcp"
      - "51820:51820/udp"
    volumes:
      - wg-config:/etc/wireguard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: midori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midori}
      POSTGRES_DB: midori_vpn
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U midori -d midori_vpn" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

  redis:
    image: redis:7-alpine
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

volumes:
  wg-config:
  pg-data:

networks:
  vpn-net:
    driver: bridge
