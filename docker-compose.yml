name: vpn-core

services:
  vpn-core:
    image: goastian/vpn-core:latest
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    env_file:
      - .env
    ports:
      - "8080:8080/tcp"
      - "51820:51820/udp"
    volumes:
      - wg-config:/etc/wireguard
    networks:
      - vpn-net

volumes:
  wg-config:

networks:
  vpn-net:
    driver: bridge