name: vpn-core

services:
  vpn-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: goastian/vpn-core:latest
    restart: always
    # Host must pre-load the wireguard kernel module:
    #   modprobe wireguard  (or add to /etc/modules-load.d/wireguard.conf)
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    env_file:
      - .env
    ports:
      # WireGuard UDP — must be reachable by VPN clients directly.
      - "51820:51820/udp"
      # Host nginx proxies vpn.astian.org to 127.0.0.1:8085.
      # Keep the API bound to loopback only so it is not directly exposed.
      - "127.0.0.1:8085:8080/tcp"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - wg-config:/etc/wireguard:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net

  postgres:
    image: docker.io/postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: midori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: midori_vpn
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U midori -d midori_vpn" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

  redis:
    image: docker.io/redis:7-alpine
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

volumes:
  wg-config:
  pg-data:

networks:
  vpn-net:
    driver: bridge
