# Production Core-only deployment behind host nginx.
#
# TLS terminates on nginx installed on the host. Generate .env and the host
# vhost with:
#   sudo scripts/setup-core-host.sh
#
# Usage:
#   docker compose -f docker-compose-prod.yml up -d

name: vpn-core-prod

services:
  vpn-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: goastian/vpn-core:latest
    restart: always
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    env_file:
      - .env
    environment:
      # Host nginx proxies to 127.0.0.1:${VPN_CORE_HOST_PORT:-8085}.
      # Docker normally presents host-originated traffic from a bridge address,
      # so trust the private Docker bridge ranges for forwarded client IPs.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    ports:
      # WireGuard UDP must be reachable by VPN clients directly.
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
      # Optional HTTP CONNECT proxy. If PROXY_ENABLED=false, nothing listens.
      - "${PROXY_PORT:-8888}:${PROXY_PORT:-8888}/tcp"
      # Core HTTP API is loopback-only; host nginx is the public TLS frontend.
      - "127.0.0.1:${VPN_CORE_HOST_PORT:-8085}:8080/tcp"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - wg-config:/etc/wireguard:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net

  postgres:
    image: docker.io/postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-midori_vpn}
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

  redis:
    image: docker.io/redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

volumes:
  wg-config:
  pg-data:

networks:
  vpn-net:
    driver: bridge
