# Production deployment with nginx TLS reverse proxy.
#
# Prerequisites:
#   1. Set DOMAIN in .env (e.g. DOMAIN=vpn.astian.org)
#   2. Place TLS certificates in ./certs/:
#        certs/fullchain.pem
#        certs/privkey.pem
#   3. Ensure the wireguard kernel module is loaded on the host:
#        modprobe wireguard
#   4. Set strong passwords in .env:
#        POSTGRES_PASSWORD=<random>
#        REDIS_PASSWORD=<random>
#
# Usage:
#   docker compose -f docker-compose-prod.yml up -d

name: vpn-core-prod

services:
  nginx:
    image: docker.io/nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro,Z
      - ./certs:/etc/nginx/certs:ro,Z
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    depends_on:
      - vpn-core
    networks:
      - vpn-net

  vpn-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: goastian/vpn-core:latest
    restart: always
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    env_file:
      - .env
    environment:
      # Trust only the internal Docker bridge network where nginx runs.
      # Use 'docker network inspect vpn-core-prod_vpn-net' to find the exact
      # subnet and narrow this further if needed.
      TRUSTED_PROXIES: "172.16.0.0/12"
      CORS_ALLOWED_ORIGINS: "https://${DOMAIN:?Set DOMAIN in .env}"
    # No HTTP port exposed to host — only nginx can reach :8080.
    ports:
      - "51820:51820/udp"
      # HTTP CONNECT proxy — used by the browser extension to tunnel traffic.
      # Authenticated via Proxy-Authorization Bearer token.
      - "8888:8888/tcp"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - wg-config:/etc/wireguard:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net

  postgres:
    image: docker.io/postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-midori_vpn}
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

  redis:
    image: docker.io/redis:7-alpine
    restart: always
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

volumes:
  wg-config:
  pg-data:

networks:
  vpn-net:
    driver: bridge
