# Production deployment with Caddy TLS reverse proxy.
#
# Prerequisites:
#   1. Set DOMAIN in .env (e.g. DOMAIN=vpn.astian.org)
#   2. Ensure the wireguard kernel module is loaded on the host:
#        modprobe wireguard
#   3. Set strong passwords in .env:
#        POSTGRES_PASSWORD=<random>
#        REDIS_PASSWORD=<random>
#
# Usage:
#   docker compose -f docker-compose-prod.yml up -d

name: vpn-core-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    depends_on:
      - vpn-core
    networks:
      - vpn-net

  vpn-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: goastian/vpn-core:latest
    restart: always
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    env_file:
      - .env
    environment:
      # Trust any container on the internal Docker network.
      # Adjust to your Docker bridge subnet if customized.
      TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      CORS_ALLOWED_ORIGINS: "https://${DOMAIN:?Set DOMAIN in .env}"
    # No HTTP port exposed to host — only Caddy can reach :8080
    ports:
      - "51820:51820/udp"
    volumes:
      - wg-config:/etc/wireguard
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: midori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: midori_vpn
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U midori -d midori_vpn" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

  redis:
    image: redis:7-alpine
    restart: always
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

volumes:
  wg-config:
  pg-data:
  caddy-data:
  caddy-config:

networks:
  vpn-net:
    driver: bridge
