<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error Pages</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f8f9fa;
        color: #333;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .error-container {
        text-align: center;
      }
      .error-code {
        font-size: 5rem;
        color: #004aad;
        margin: 0;
      }
      .error-message {
        font-size: 1.5rem;
        margin: 10px 0;
      }
      .home-link {
        background: #004aad;
        color: #fff;
        padding: 10px 20px;
        border-radius: 5px;
        text-decoration: none;
        font-size: 1rem;
      }
      .home-link:hover {
        background: #002f6d;
      }
    </style>
  </head>
  <body>
    <!-- Error 404 Page -->
    <div class="error-container" id="error-404">
      <h1 class="error-code">404</h1>
      <p class="error-message">
        Oops! The page you are looking for cannot be found.
      </p>
      <a href="/" class="home-link">Go Back Home</a>
    </div>
  </body>
</html>
