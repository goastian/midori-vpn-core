name: vpn-core-dev

services:
  vpn-core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Host must pre-load the wireguard kernel module:
    #   modprobe wireguard
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    env_file:
      - .env
    ports:
      - "8080:8080/tcp"
      - "8888:8888/tcp"
      - "51820:51820/udp"
    volumes:
      - wg-config:/etc/wireguard:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vpn-net

  postgres:
    image: docker.io/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-midori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-midori}
      POSTGRES_DB: ${POSTGRES_DB:-midori_vpn}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

  redis:
    image: docker.io/redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-midori}" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-midori}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vpn-net

volumes:
  wg-config:
  pg-data:

networks:
  vpn-net:
    driver: bridge
