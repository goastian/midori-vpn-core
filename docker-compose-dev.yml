version: "3.9"

services:
  vpn-core:
    image: elyerr/vpn-core:dev
    container_name: vpn-core
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8021:8000"
    volumes:
      - vpn-core-data:/app/config
      - .env:/app/.env
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - UVICORN_WORKERS=4 
    networks:
      - vpn_core_public_net

volumes:
  vpn-core-data:

networks:
  vpn_core_public_net:
    driver: bridge